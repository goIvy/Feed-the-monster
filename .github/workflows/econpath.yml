name: EconPath

on:
  push:
    paths: ["econpath/**", ".github/workflows/econpath.yml"]
  pull_request:
    paths: ["econpath/**", ".github/workflows/econpath.yml"]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: econpath/web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: econpath/web/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: econpath/api } }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: econpath, POSTGRES_PASSWORD: econpath, POSTGRES_DB: econpath }
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: econpath/api/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Seed data validates and generated JSON is up to date
        run: python -m app.seed.build && git diff --exit-code -- ../data/generated ../web/src/data/generated
      - name: Schema file is up to date
        run: python -m app.db.dump_schema && git diff --exit-code -- db/schema.sql
      - run: python -m pytest -q
        env: { ECONPATH_TEST_DATABASE_URL: "postgresql+psycopg://econpath:econpath@localhost:5432/econpath" }
